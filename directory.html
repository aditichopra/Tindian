<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fictional, browser-only dating app demo.">
    <title>Sanyog Milan | Discover</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #29233a;
            --muted: #777386;
            --accent: #c34272;
            --accent-dark: #a52e5b;
            --surface: #ffffff;
            --background: #f7f3f6;
            --border: #eee8ee;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 10% 0%, #f8e5ee 0, transparent 34rem),
                var(--background);
        }

        button, select { font: inherit; }
        button { cursor: pointer; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.15rem 1.25rem;
        }

        .brand {
            color: var(--accent-dark);
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -.04em;
            text-decoration: none;
        }

        .demo-label {
            padding: .4rem .7rem;
            border: 1px solid #f0cbd9;
            border-radius: 999px;
            color: var(--accent-dark);
            background: #fff8fb;
            font-size: .75rem;
            font-weight: 700;
        }

        main {
            width: min(100% - 2rem, 1020px);
            margin: 2rem auto 4rem;
        }

        .intro {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.4rem); letter-spacing: -.05em; }
        .intro p { margin: .45rem 0 0; color: var(--muted); }

        .filter {
            display: flex;
            align-items: center;
            gap: .55rem;
            color: var(--muted);
            font-size: .9rem;
        }

        select {
            padding: .65rem 2rem .65rem .8rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--ink);
            background: var(--surface);
        }

        .tabs {
            display: flex;
            gap: .5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: .75rem 1rem;
            border: 0;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            background: transparent;
            font-weight: 700;
        }

        .tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent-dark); }
        .count { margin-left: .25rem; font-size: .8rem; }

        .content { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 1.25rem; align-items: start; }
        .profile-card, .side-card, .empty-state, .match-card {
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 12px 35px #4930460a;
        }

        .profile-card { overflow: hidden; }
        .portrait {
            display: grid;
            min-height: 300px;
            place-items: center;
            background: linear-gradient(140deg, var(--portrait-a), var(--portrait-b));
            font-size: 8rem;
        }

        .profile-info { padding: 1.25rem 1.4rem 1.4rem; }
        .profile-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
        .profile-heading h2 { margin: 0; font-size: 1.5rem; }
        .location { color: var(--muted); font-size: .9rem; }
        .bio { margin: .8rem 0; color: #514d5d; line-height: 1.55; }
        .interests { display: flex; flex-wrap: wrap; gap: .45rem; }
        .interest {
            padding: .38rem .65rem;
            border-radius: 999px;
            color: #73445b;
            background: #f9edf2;
            font-size: .8rem;
            font-weight: 650;
        }

        .actions { display: flex; justify-content: center; gap: 1rem; padding: 0 1rem 1.3rem; }
        .action {
            display: grid;
            width: 58px;
            height: 58px;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            box-shadow: 0 5px 15px #29233a0d;
            font-size: 1.5rem;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .action:hover { transform: translateY(-2px); box-shadow: 0 8px 18px #29233a18; }
        .action:focus-visible, .tab:focus-visible, .text-button:focus-visible, select:focus-visible, .modal button:focus-visible {
            outline: 3px solid #d783a2;
            outline-offset: 3px;
        }
        .action.pass { color: #777386; }
        .action.like { border-color: #f2cfdd; color: var(--accent); }

        .side-card { padding: 1.1rem; }
        .side-card h2 { margin: 0 0 .45rem; font-size: 1rem; }
        .side-card p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
        .stats { display: flex; justify-content: space-between; margin: 1rem 0; padding: .8rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .stat { display: grid; gap: .15rem; color: var(--muted); font-size: .78rem; }
        .stat strong { color: var(--ink); font-size: 1.15rem; }
        .text-button { padding: 0; border: 0; color: var(--accent-dark); background: transparent; font-weight: 700; }

        .empty-state { padding: 3rem 1.5rem; text-align: center; }
        .empty-state .emoji { font-size: 3rem; }
        .empty-state h2 { margin: .5rem 0; }
        .empty-state p { margin: 0 auto 1rem; max-width: 430px; color: var(--muted); line-height: 1.5; }
        .primary-button {
            padding: .7rem 1rem;
            border: 0;
            border-radius: 12px;
            color: white;
            background: var(--accent);
            font-weight: 750;
        }
        .primary-button:hover { background: var(--accent-dark); }

        .matches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .match-card { display: flex; align-items: center; gap: .9rem; padding: 1rem; }
        .match-avatar { display: grid; width: 58px; height: 58px; flex: 0 0 auto; place-items: center; border-radius: 18px; font-size: 2rem; }
        .match-card h2 { margin: 0; font-size: 1rem; }
        .match-card p { margin: .25rem 0 0; color: var(--muted); font-size: .85rem; }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            padding: 1rem;
            background: #211a2dcc;
        }
        .modal {
            width: min(100%, 390px);
            padding: 2rem;
            border-radius: 24px;
            background: white;
            text-align: center;
            box-shadow: 0 20px 70px #17121c55;
        }
        .modal .emoji { font-size: 3.5rem; }
        .modal h2 { margin: .4rem 0; font-size: 1.8rem; }
        .modal p { margin: 0 0 1.2rem; color: var(--muted); line-height: 1.5; }
        .modal-actions { display: flex; justify-content: center; gap: .65rem; }
        .secondary-button { padding: .7rem 1rem; border: 1px solid var(--border); border-radius: 12px; color: var(--ink); background: white; font-weight: 700; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }

        @media (max-width: 700px) {
            main { margin-top: 1rem; }
            .intro { align-items: start; flex-direction: column; }
            .content { grid-template-columns: 1fr; }
            .side-card { order: 2; }
            .portrait { min-height: 240px; font-size: 6rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#" aria-label="Sanyog Milan home">Sanyog Milan</a>
        <span class="demo-label">FICTIONAL DEMO · NO ACCOUNT NEEDED</span>
    </header>

    <main>
        <section class="intro" aria-labelledby="page-title">
            <div>
                <h1 id="page-title">Meet someone new</h1>
                <p>Discover people and interests that make you smile.</p>
            </div>
            <label class="filter" for="interest-filter">
                Show
                <select id="interest-filter">
                    <option value="all">All interests</option>
                </select>
            </label>
        </section>

        <nav class="tabs" aria-label="App sections">
            <button class="tab" id="discover-tab" type="button" aria-selected="true">Discover</button>
            <button class="tab" id="matches-tab" type="button" aria-selected="false">Matches <span class="count" id="match-count">(0)</span></button>
        </nav>

        <section id="app-content" aria-live="polite"></section>
    </main>

    <div id="modal-root"></div>
    <p id="announcement" class="sr-only" aria-live="polite"></p>

    <script>
        const profiles = [
            {
                id: 1,
                name: "Maya",
                age: 27,
                city: "Chiang Mai",
                emoji: "🌻",
                bio: "Weekend markets, mountain walks, and finding the best mango sticky rice in town.",
                interests: ["Hiking", "Food", "Travel"],
                colors: ["#ffe0b9", "#f3a5a9"],
                willMatch: true
            },
            {
                id: 2,
                name: "Narin",
                age: 30,
                city: "Bangkok",
                emoji: "🎸",
                bio: "Amateur guitarist, coffee enthusiast, and always up for a tiny neighborhood adventure.",
                interests: ["Music", "Coffee", "Art"],
                colors: ["#d9d4ff", "#b8c5f8"],
                willMatch: false
            },
            {
                id: 3,
                name: "Pim",
                age: 26,
                city: "Phuket",
                emoji: "🌊",
                bio: "Ocean swims before breakfast and a good book after. Tell me your favorite beach.",
                interests: ["Beach", "Reading", "Travel"],
                colors: ["#bcebe6", "#90c9e8"],
                willMatch: true
            },
            {
                id: 4,
                name: "Arun",
                age: 29,
                city: "Bangkok",
                emoji: "🥑",
                bio: "Trying new recipes, cycling by the river, and making playlists for every occasion.",
                interests: ["Cooking", "Cycling", "Music"],
                colors: ["#d4efce", "#f4d0b6"],
                willMatch: false
            },
            {
                id: 5,
                name: "Dao",
                age: 28,
                city: "Chiang Rai",
                emoji: "📷",
                bio: "Photographer collecting little moments, scenic train rides, and good conversations.",
                interests: ["Photography", "Travel", "Art"],
                colors: ["#f5c7dc", "#cfc3f1"],
                willMatch: true
            }
        ];

        const state = {
            tab: "discover",
            filter: "all",
            seen: [],
            liked: [],
            matches: []
        };

        const content = document.querySelector("#app-content");
        const matchCount = document.querySelector("#match-count");
        const filterSelect = document.querySelector("#interest-filter");
        const announcement = document.querySelector("#announcement");
        const modalRoot = document.querySelector("#modal-root");

        function setupFilters() {
            const interests = [...new Set(profiles.flatMap((profile) => profile.interests))].sort();
            interests.forEach((interest) => {
                const option = document.createElement("option");
                option.value = interest;
                option.textContent = interest;
                filterSelect.append(option);
            });
        }

        function visibleProfiles() {
            return profiles.filter((profile) =>
                !state.seen.includes(profile.id) &&
                (state.filter === "all" || profile.interests.includes(state.filter))
            );
        }

        function render() {
            document.querySelector("#discover-tab").setAttribute("aria-selected", String(state.tab === "discover"));
            document.querySelector("#matches-tab").setAttribute("aria-selected", String(state.tab === "matches"));
            matchCount.textContent = `(${state.matches.length})`;

            if (state.tab === "matches") {
                renderMatches();
                return;
            }

            const profile = visibleProfiles()[0];
            if (!profile) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji" aria-hidden="true">✨</div>
                        <h2>You're all caught up</h2>
                        <p>There are no more profiles for this filter. Try another interest or start over.</p>
                        <button class="primary-button" type="button" data-action="reset">Show profiles again</button>
                    </div>`;
                return;
            }

            content.innerHTML = `
                <div class="content">
                    <article class="profile-card" aria-label="${profile.name}, age ${profile.age}">
                        <div class="portrait" style="--portrait-a:${profile.colors[0]};--portrait-b:${profile.colors[1]}" aria-hidden="true">${profile.emoji}</div>
                        <div class="profile-info">
                            <div class="profile-heading">
                                <h2>${profile.name}, ${profile.age}</h2>
                                <span class="location">${profile.city}</span>
                            </div>
                            <p class="bio">${profile.bio}</p>
                            <div class="interests" aria-label="Interests">
                                ${profile.interests.map((interest) => `<span class="interest">${interest}</span>`).join("")}
                            </div>
                        </div>
                        <div class="actions" aria-label="Choose whether to like this profile">
                            <button class="action pass" type="button" data-action="pass" aria-label="Pass on ${profile.name}" title="Pass">×</button>
                            <button class="action like" type="button" data-action="like" aria-label="Like ${profile.name}" title="Like">♥</button>
                        </div>
                    </article>
                    <aside class="side-card">
                        <h2>A little kindness goes a long way</h2>
                        <p>Take your time, be yourself, and make every interaction respectful.</p>
                        <div class="stats">
                            <span class="stat"><strong>${state.seen.length}</strong>Profiles seen</span>
                            <span class="stat"><strong>${state.liked.length}</strong>Likes sent</span>
                        </div>
                        <button class="text-button" type="button" data-action="reset">Start over</button>
                    </aside>
                </div>`;
        }

        function renderMatches() {
            if (state.matches.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji" aria-hidden="true">💌</div>
                        <h2>Your matches will appear here</h2>
                        <p>Like a profile in Discover to see whether you have a mutual match.</p>
                        <button class="primary-button" type="button" data-action="discover">Back to Discover</button>
                    </div>`;
                return;
            }

            content.innerHTML = `<div class="matches-grid">${state.matches.map((profile) => `
                <article class="match-card">
                    <div class="match-avatar" style="background:linear-gradient(140deg, ${profile.colors[0]}, ${profile.colors[1]})" aria-hidden="true">${profile.emoji}</div>
                    <div><h2>${profile.name}, ${profile.age}</h2><p>It's a match! Say hello in real life—or just enjoy the demo.</p></div>
                </article>`).join("")}</div>`;
        }

        function showMatch(profile) {
            modalRoot.innerHTML = `
                <div class="modal-backdrop">
                    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="match-title" aria-describedby="match-description">
                        <div class="emoji" aria-hidden="true">💖</div>
                        <h2 id="match-title">It's a match!</h2>
                        <p id="match-description">You and ${profile.name} liked each other. This is a fictional demo—no message was sent.</p>
                        <div class="modal-actions">
                            <button class="secondary-button" type="button" data-action="close-modal">Keep browsing</button>
                            <button class="primary-button" type="button" data-action="view-matches">View matches</button>
                        </div>
                    </section>
                </div>`;
            modalRoot.querySelector("button").focus();
        }

        function respond(action) {
            if (action === "discover") {
                state.tab = "discover";
                render();
                return;
            }

            if (action === "reset") {
                state.seen = [];
                state.liked = [];
                state.matches = [];
                state.tab = "discover";
                render();
                announcement.textContent = "Profiles have been reset.";
                return;
            }

            if (action === "close-modal") {
                modalRoot.innerHTML = "";
                render();
                document.querySelector('[data-action="like"], [data-action="pass"]')?.focus();
                return;
            }

            if (action === "view-matches") {
                modalRoot.innerHTML = "";
                state.tab = "matches";
                render();
                document.querySelector("#matches-tab").focus();
                return;
            }

            const profile = visibleProfiles()[0];
            if (!profile || !["like", "pass"].includes(action)) return;

            state.seen.push(profile.id);
            if (action === "like") {
                state.liked.push(profile.id);
                if (profile.willMatch) {
                    state.matches.push(profile);
                    showMatch(profile);
                } else {
                    announcement.textContent = `You liked ${profile.name}.`;
                }
            } else {
                announcement.textContent = `You passed on ${profile.name}.`;
            }

            render();
        }

        document.querySelector("#discover-tab").addEventListener("click", () => {
            state.tab = "discover";
            render();
        });

        document.querySelector("#matches-tab").addEventListener("click", () => {
            state.tab = "matches";
            render();
        });

        filterSelect.addEventListener("change", (event) => {
            state.filter = event.target.value;
            state.tab = "discover";
            render();
        });

        content.addEventListener("click", (event) => {
            const button = event.target.closest("[data-action]");
            if (button) respond(button.dataset.action);
        });

        modalRoot.addEventListener("click", (event) => {
            if (event.target.classList.contains("modal-backdrop")) {
                modalRoot.innerHTML = "";
                render();
            }
            const button = event.target.closest("[data-action]");
            if (button) respond(button.dataset.action);
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && modalRoot.firstElementChild) {
                modalRoot.innerHTML = "";
                render();
            }
        });

        setupFilters();
        render();
    </script>
</body>
</html>
